site_name: OpenBreather 
site_url: https://sitename.example
theme:
  name: material
  font: 
    text: Rubik
    code: Red Hat Text
  icon:
    logo: material/chart-bubble
  # favicon: material/chart-bubble
  # features:
  #   - navigation.footer
  palette: 
    scheme: default
    primary: yellow
    accent: blue

markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - toc:
      toc_depth: 0

extra_css:
  - stylesheets/extra.css


